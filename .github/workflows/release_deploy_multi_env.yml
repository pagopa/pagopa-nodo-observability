name: Release And Deploy (Multi-env)

# Manual/called only: merged PRs are released by release_deploy.yml, so a pull_request
# trigger here would bump the version twice.
on:
  workflow_dispatch:
    inputs:
      deploy_dev:
        required: false
        type: boolean
        description: Deploy to dev
        default: false
      deploy_uat:
        required: false
        type: boolean
        description: Deploy to uat
        default: false
      deploy_prod:
        required: false
        type: boolean
        description: Deploy to prod
        default: false
      deploy_mode:
        required: false
        type: choice
        description: Select the deployment mode
        default: parallel
        options:
          - parallel
          - sequential
      semver:
        required: false
        type: choice
        description: Select the version
        default: patch
        options:
          - skip
          - promote
          - patch
          - new_release
          - breaking_change
      beta:
        required: false
        type: boolean
        description: Deploy beta version on AKS
        default: false

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      semver:
        required: true
        type: string

permissions:
  packages: write
  contents: write
  issues: write
  id-token: write
  actions: read

env:
  APP_NAME: nodo-observability-fe

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.semver_resolver.outputs.semver }}
      environments: ${{ steps.selection.outputs.environments }}
      package_version: ${{ steps.package_version.outputs.package_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@1f9a0c22da41e6ebfa534300ef656657ea2c6707
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read package version
        id: package_version
        run: echo "package_version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Select environments
        id: selection
        env:
          LEGACY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_DEV: ${{ inputs.deploy_dev }}
          DEPLOY_UAT: ${{ inputs.deploy_uat }}
          DEPLOY_PROD: ${{ inputs.deploy_prod }}
        run: |
          environments=()
          if [[ -n "$LEGACY_ENVIRONMENT" ]]; then
            case "$LEGACY_ENVIRONMENT" in
              dev|uat|prod)
                environments=("$LEGACY_ENVIRONMENT")
                ;;
              all)
                environments=(dev uat prod)
                ;;
              *)
                echo "::error::Unsupported environment '${LEGACY_ENVIRONMENT}'. Use dev, uat, prod, or all."
                exit 1
                ;;
            esac
          else
            [[ "$DEPLOY_DEV" == "true" ]] && environments+=(dev)
            [[ "$DEPLOY_UAT" == "true" ]] && environments+=(uat)
            [[ "$DEPLOY_PROD" == "true" ]] && environments+=(prod)
          fi

          if (( ${#environments[@]} == 0 )); then
            echo "::error::Select at least one environment to deploy."
            exit 1
          fi

          environments_json="$(printf '%s\n' "${environments[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "environments=${environments_json}" >> "$GITHUB_OUTPUT"

      - name: Resolve semver
        id: semver_resolver
        env:
          ENVIRONMENTS: ${{ steps.selection.outputs.environments }}
          SEMVER: ${{ inputs.semver }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          case "$SEMVER" in
            patch|promote|skip|new_release|breaking_change) ;;
            *)
              echo "::error::Unsupported semver '${SEMVER}'."
              exit 1
              ;;
          esac

          if jq -e 'index("uat") != null or index("prod") != null' <<< "$ENVIRONMENTS" > /dev/null; then
            if [[ "$REF_NAME" == "main" ]]; then
              echo "::error::UAT and prod cannot be deployed from main."
              exit 1
            fi
            case "$SEMVER" in
              new_release|breaking_change)
                echo "::error::UAT and prod do not support '${SEMVER}'."
                exit 1
                ;;
            esac
            if [[ "$REF_TYPE" == "tag" || "$SEMVER" != "patch" ]]; then
              resolved=skip
            else
              resolved=patch
            fi
          elif [[ "$SEMVER" == "promote" || "$SEMVER" == "skip" ]]; then
            resolved=skip
          elif [[ "$REF_TYPE" == "tag" ]]; then
            echo "::error::Dev-only tag deployments support only 'promote' or 'skip'."
            exit 1
          elif [[ "$REF_NAME" != "main" ]]; then
            resolved=buildNumber
          else
            case "$SEMVER" in
              patch) resolved=patch ;;
              new_release) resolved=minor ;;
              breaking_change) resolved=major ;;
            esac
          fi
          echo "semver=${resolved}" >> "$GITHUB_OUTPUT"

  preflight:
    needs: [setup]
    name: Check AKS prerequisites (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.setup.outputs.environments) }}
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@1f9a0c22da41e6ebfa534300ef656657ea2c6707
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check Helm chart and environment variables
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          NAMESPACE: ${{ vars.NAMESPACE }}
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          CLUSTER_RESOURCE_GROUP: ${{ vars.CLUSTER_RESOURCE_GROUP }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
        run: |
          missing=0
          for file in helm/Chart.yaml "helm/values-${ENVIRONMENT}.yaml"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing ${file}: the AKS Helm chart is not defined for ${ENVIRONMENT}."
              missing=1
            fi
          done
          if grep -n '<TO_BE_DEFINED_' helm/Chart.yaml "helm/values-${ENVIRONMENT}.yaml" 2>/dev/null; then
            echo "::error::Unresolved <TO_BE_DEFINED_...> placeholders in the Helm chart for ${ENVIRONMENT}."
            missing=1
          fi
          for name in NAMESPACE CLUSTER_NAME CLUSTER_RESOURCE_GROUP API_BASE_URL ENTRA_TENANT_ID ENTRA_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub environment variable ${name} for ${ENVIRONMENT}."
              missing=1
            fi
          done
          exit "$missing"

      - name: Base href from the HAProxy ingress path
        id: base_href
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          INGRESS_PATH="$(yq -r '.microservice-chart.ingress.haproxy.path' "helm/values-${ENVIRONMENT}.yaml")"
          if [[ ! "$INGRESS_PATH" =~ ^/[A-Za-z0-9._/-]*$ ]]; then
            echo "::error::Invalid microservice-chart.ingress.haproxy.path '${INGRESS_PATH}' in helm/values-${ENVIRONMENT}.yaml."
            exit 1
          fi
          BASE_HREF="$INGRESS_PATH"
          while [[ "$BASE_HREF" == */ ]]; do
            BASE_HREF="${BASE_HREF%/}"
          done
          echo "base_href=${BASE_HREF}/" >> "$GITHUB_OUTPUT"

  release:
    needs: [setup, preflight]
    name: Create a New Release
    runs-on: ubuntu-latest
    if: ${{ needs.setup.outputs.semver != 'skip' }}
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Make Release
        id: release
        uses: pagopa/github-actions-template/node-release@d2952cbcfaf4708ff5aeabdacf24056d082b8034
        with:
          semver: ${{ needs.setup.outputs.semver }}
          github_token: ${{ secrets.BOT_TOKEN_GITHUB }}
          beta: ${{ inputs.beta || false }}
          skip_ci: false

  image:
    needs: [setup, preflight, release]
    name: Build and Push Docker Image (${{ matrix.environment }})
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() && needs.setup.result == 'success' && needs.preflight.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && needs.setup.outputs.semver == 'skip')) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.setup.outputs.environments) }}
    environment: ${{ matrix.environment }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@1f9a0c22da41e6ebfa534300ef656657ea2c6707
        with:
          ref: ${{ needs.release.result == 'success' && format('refs/tags/{0}', needs.release.outputs.version) || github.sha }}
          persist-credentials: false

      - name: Image tag
        id: version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version || needs.setup.outputs.package_version }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          VERSION="${RELEASE_VERSION}"
          echo "tag=${VERSION}-${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

      - name: Base href from the HAProxy ingress path
        id: base_href
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          INGRESS_PATH="$(yq -r '.microservice-chart.ingress.haproxy.path' "helm/values-${ENVIRONMENT}.yaml")"
          if [[ ! "$INGRESS_PATH" =~ ^/[A-Za-z0-9._/-]*$ ]]; then
            echo "::error::Invalid microservice-chart.ingress.haproxy.path '${INGRESS_PATH}' in helm/values-${ENVIRONMENT}.yaml."
            exit 1
          fi
          BASE_HREF="$INGRESS_PATH"
          while [[ "$BASE_HREF" == */ ]]; do
            BASE_HREF="${BASE_HREF%/}"
          done
          echo "base_href=${BASE_HREF}/" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest-${{ matrix.environment }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_BASE_URL=${{ vars.API_BASE_URL }}
            ENTRA_TENANT_ID=${{ secrets.ENTRA_TENANT_ID }}
            ENTRA_CLIENT_ID=${{ vars.ENTRA_CLIENT_ID }}
            ENTRA_SCOPES=${{ vars.ENTRA_SCOPES }}
            BASE_HREF=${{ steps.base_href.outputs.base_href }}

  deploy_parallel:
    name: Deploy on AKS (${{ matrix.environment }})
    needs: [setup, preflight, release, image]
    if: ${{ always() && !cancelled() && needs.setup.result == 'success' && needs.preflight.result == 'success' && needs.image.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && needs.setup.outputs.semver == 'skip')) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (inputs.deploy_mode == 'parallel' || inputs.deploy_mode == '') }}
    runs-on: [self-hosted-job, '${{ matrix.environment }}']
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.setup.outputs.environments) }}
    steps:
      - name: Helm options
        id: helm_options
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version || needs.setup.outputs.package_version }}
          ENVIRONMENT: ${{ matrix.environment }}
          BETA_RELEASE: ${{ inputs.beta && needs.release.result == 'success' }}
        run: |
          tag="${RELEASE_VERSION}-${ENVIRONMENT}"
          options="--debug --set microservice-chart.forceRedeploy=true --set microservice-chart.canaryDelivery.image.tag=${tag}"
          if [[ "$BETA_RELEASE" == "true" ]]; then
            options="${options} --set microservice-chart.canaryDelivery.create=true"
          else
            options="${options} --set microservice-chart.image.tag=${tag}"
          fi
          echo "options=${options}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: pagopa/github-actions-template/aks-deploy@5e788a4717069100914e66149997ecfd4c48b746
        with:
          branch: ${{ needs.release.result == 'success' && format('refs/tags/{0}', needs.release.outputs.version) || github.sha }}
          client_id: ${{ secrets.CD_CLIENT_ID }}
          subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.ENTRA_TENANT_ID }}
          env: ${{ matrix.environment }}
          namespace: ${{ vars.NAMESPACE }}
          cluster_name: ${{ vars.CLUSTER_NAME }}
          resource_group: ${{ vars.CLUSTER_RESOURCE_GROUP }}
          app_name: ${{ env.APP_NAME }}
          helm_upgrade_options: ${{ steps.helm_options.outputs.options }} --set microservice-chart.azure.workloadIdentityClientId=${{ vars.WORKLOAD_IDENTITY_ID }}

  deploy_dev:
    name: Deploy on AKS (dev)
    needs: [setup, preflight, release, image]
    if: ${{ always() && !cancelled() && needs.setup.result == 'success' && needs.preflight.result == 'success' && needs.image.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && needs.setup.outputs.semver == 'skip')) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && inputs.deploy_mode == 'sequential' && contains(fromJSON(needs.setup.outputs.environments), 'dev') }}
    runs-on: [self-hosted-job, 'dev']
    environment: dev
    steps:
      - name: Helm options
        id: helm_options
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version || needs.setup.outputs.package_version }}
          ENVIRONMENT: dev
          BETA_RELEASE: ${{ inputs.beta && needs.release.result == 'success' }}
        run: |
          tag="${RELEASE_VERSION}-${ENVIRONMENT}"
          options="--debug --set microservice-chart.forceRedeploy=true --set microservice-chart.canaryDelivery.image.tag=${tag}"
          if [[ "$BETA_RELEASE" == "true" ]]; then
            options="${options} --set microservice-chart.canaryDelivery.create=true"
          else
            options="${options} --set microservice-chart.image.tag=${tag}"
          fi
          echo "options=${options}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: pagopa/github-actions-template/aks-deploy@5e788a4717069100914e66149997ecfd4c48b746
        with:
          branch: ${{ needs.release.result == 'success' && format('refs/tags/{0}', needs.release.outputs.version) || github.sha }}
          client_id: ${{ secrets.CD_CLIENT_ID }}
          subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.ENTRA_TENANT_ID }}
          env: dev
          namespace: ${{ vars.NAMESPACE }}
          cluster_name: ${{ vars.CLUSTER_NAME }}
          resource_group: ${{ vars.CLUSTER_RESOURCE_GROUP }}
          app_name: ${{ env.APP_NAME }}
          helm_upgrade_options: ${{ steps.helm_options.outputs.options }} --set microservice-chart.azure.workloadIdentityClientId=${{ vars.WORKLOAD_IDENTITY_ID }}

  deploy_uat:
    name: Deploy on AKS (uat)
    needs: [setup, preflight, release, image, deploy_dev]
    if: ${{ always() && !cancelled() && needs.setup.result == 'success' && needs.preflight.result == 'success' && needs.image.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && needs.setup.outputs.semver == 'skip')) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && inputs.deploy_mode == 'sequential' && contains(fromJSON(needs.setup.outputs.environments), 'uat') && (needs.deploy_dev.result == 'success' || (needs.deploy_dev.result == 'skipped' && !contains(fromJSON(needs.setup.outputs.environments), 'dev'))) }}
    runs-on: [self-hosted-job, 'uat']
    environment: uat
    steps:
      - name: Helm options
        id: helm_options
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version || needs.setup.outputs.package_version }}
          ENVIRONMENT: uat
          BETA_RELEASE: ${{ inputs.beta && needs.release.result == 'success' }}
        run: |
          tag="${RELEASE_VERSION}-${ENVIRONMENT}"
          options="--debug --set microservice-chart.forceRedeploy=true --set microservice-chart.canaryDelivery.image.tag=${tag}"
          if [[ "$BETA_RELEASE" == "true" ]]; then
            options="${options} --set microservice-chart.canaryDelivery.create=true"
          else
            options="${options} --set microservice-chart.image.tag=${tag}"
          fi
          echo "options=${options}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: pagopa/github-actions-template/aks-deploy@5e788a4717069100914e66149997ecfd4c48b746
        with:
          branch: ${{ needs.release.result == 'success' && format('refs/tags/{0}', needs.release.outputs.version) || github.sha }}
          client_id: ${{ secrets.CD_CLIENT_ID }}
          subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.ENTRA_TENANT_ID }}
          env: uat
          namespace: ${{ vars.NAMESPACE }}
          cluster_name: ${{ vars.CLUSTER_NAME }}
          resource_group: ${{ vars.CLUSTER_RESOURCE_GROUP }}
          app_name: ${{ env.APP_NAME }}
          helm_upgrade_options: ${{ steps.helm_options.outputs.options }} --set microservice-chart.azure.workloadIdentityClientId=${{ vars.WORKLOAD_IDENTITY_ID }}

  deploy_prod:
    name: Deploy on AKS (prod)
    needs: [setup, preflight, release, image, deploy_dev, deploy_uat]
    if: ${{ always() && !cancelled() && needs.setup.result == 'success' && needs.preflight.result == 'success' && needs.image.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && needs.setup.outputs.semver == 'skip')) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && inputs.deploy_mode == 'sequential' && contains(fromJSON(needs.setup.outputs.environments), 'prod') && (needs.deploy_dev.result == 'success' || (needs.deploy_dev.result == 'skipped' && !contains(fromJSON(needs.setup.outputs.environments), 'dev'))) && (needs.deploy_uat.result == 'success' || (needs.deploy_uat.result == 'skipped' && !contains(fromJSON(needs.setup.outputs.environments), 'uat'))) }}
    runs-on: [self-hosted-job, 'prod']
    environment: prod
    steps:
      - name: Helm options
        id: helm_options
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version || needs.setup.outputs.package_version }}
          ENVIRONMENT: prod
          BETA_RELEASE: ${{ inputs.beta && needs.release.result == 'success' }}
        run: |
          tag="${RELEASE_VERSION}-${ENVIRONMENT}"
          options="--debug --set microservice-chart.forceRedeploy=true --set microservice-chart.canaryDelivery.image.tag=${tag}"
          if [[ "$BETA_RELEASE" == "true" ]]; then
            options="${options} --set microservice-chart.canaryDelivery.create=true"
          else
            options="${options} --set microservice-chart.image.tag=${tag}"
          fi
          echo "options=${options}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: pagopa/github-actions-template/aks-deploy@5e788a4717069100914e66149997ecfd4c48b746
        with:
          branch: ${{ needs.release.result == 'success' && format('refs/tags/{0}', needs.release.outputs.version) || github.sha }}
          client_id: ${{ secrets.CD_CLIENT_ID }}
          subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.ENTRA_TENANT_ID }}
          env: prod
          namespace: ${{ vars.NAMESPACE }}
          cluster_name: ${{ vars.CLUSTER_NAME }}
          resource_group: ${{ vars.CLUSTER_RESOURCE_GROUP }}
          app_name: ${{ env.APP_NAME }}
          helm_upgrade_options: ${{ steps.helm_options.outputs.options }} --set microservice-chart.azure.workloadIdentityClientId=${{ vars.WORKLOAD_IDENTITY_ID }}
