<button type="button" class="trigger" [attr.aria-label]="label()" [attr.aria-describedby]="tooltipId" (click)="show()">
  <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
    aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="8"/></svg>
</button>
<span class="tip" role="tooltip" [id]="tooltipId" [class.open]="open()">{{ text() }}</span>
