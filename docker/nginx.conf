server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Relative redirects, so they keep the public host/scheme behind the AKS ingress.
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness/readiness probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ui {
        return 301 /ui/;
    }

    # Angular SPA (base href /ui/): unknown paths fall back to index.html for client-side routing.
    location /ui/ {
        try_files $uri $uri/ /ui/index.html;
    }

    # Always revalidate the entry point so new releases are picked up immediately.
    location = /ui/index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Content-hashed build output (outputHashing: all) can be cached forever.
    location ~* "^/ui/.+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|webp)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /error.html;
}
