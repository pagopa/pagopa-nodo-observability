<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect to UI...</title>
    <!-- Fallback nel caso JavaScript sia disabilitato -->
    <meta http-equiv="refresh" content="0; url=/ui/index.html">
    <script>
        // Reindirizzamento immediato senza aggiungere la pagina alla cronologia
        window.location.replace("/ui/index.html");
    </script>
</head>
<body>
    <p>Redirect to, <a href="/ui/index.html">/ui/index.html</a>.</p>
</body>
</html>
