microservice-chart:
  namespace: "nodo-aux"
  image:
    repository: ghcr.io/pagopa/pagopa-nodo-observability
    # Overridden by release_deploy_aks.yml with the per-environment image tag (<version>-dev).
    tag: "0.1.0-8-PAGOPA-3791-poc"
  # nginx (docker/nginx.conf) listens on 8080 and answers on /healthz.
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    failureThreshold: 3
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 10
    failureThreshold: 6
    periodSeconds: 10
  deployment:
    create: true
    replicas: 1 # same as HPA minReplica
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  service:
    create: true
    ports:
      - 8080
  ingress:
    # Legacy nginx ingress disabled: the HAProxy ingress below is used instead.
    create: false
    servicePort: 8080
    pathType: Prefix
    forceSslRedirect: true
    haproxy:
      create: true
      host: "haproxy.nodo-aux.internal.platform.pagopa.it"
      # The image is built with base href "<path>/" (release_deploy_aks.yml reads this path),
      # while nginx serves the SPA under /ui/: HAProxy rewrites <path>/<rest> to /ui/<rest>.
      path: /nodo-observability/ui
      rewriteTarget: "/ui/\\1"
      annotations:
        haproxy.org/check: "true"
  serviceMonitor:
    create: false
  serviceAccount:
    create: false
  azure:
    workloadIdentityClientId: <workload-identity-client-id-set-automatically-by-gha>
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    capabilities:
      drop:
        - all
  # nginx writes its pid and temp files under /tmp.
  tmpVolumeMount:
    create: true
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  autoscaling:
    enable: true
    minReplica: 1
    maxReplica: 2
    pollingInterval: 10 # seconds
    cooldownPeriod: 50 # seconds
    triggers:
      - type: cpu
        metricType: Utilization
        metadata:
          value: "75"
  canaryDelivery:
    create: false
    deployment:
      image:
        tag: "0.1.0-8-PAGOPA-3791-poc"
